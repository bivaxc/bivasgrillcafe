name: Align Hero Content
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: github.event.head_commit.message != 'chore: site layout cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply site layout cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          s=s.replace(".hero-inner{position:relative;z-index:2;text-align:center;margin:auto;padding:80px 0}", ".hero-inner{position:relative;z-index:2;text-align:left;margin:0;padding:80px 0}")
          s=s.replace("margin:18px auto;max-width:900px", "margin:18px 0;max-width:900px")
          s=s.replace("max-width:650px;margin:0 auto;color:#e9dbcc", "max-width:650px;margin:0;color:#e9dbcc")
          s=s.replace(".hero-actions{display:flex;justify-content:center;gap:10px", ".hero-actions{display:flex;justify-content:flex-start;gap:10px")
          s=s.replace("<p>Everything available to order, clearly organised. Choose a category or browse everything.</p>", "")
          s=s.replace(".mobile-order{display:block;position:fixed;z-index:250;left:10px;right:10px;bottom:10px;background:var(--dark);padding:10px;border-radius:13px;box-shadow:0 10px 35px #0008}.mobile-order button{width:100%;border:0;border-radius:9px;background:var(--gold);padding:12px;font-weight:900}", ".mobile-order{display:none}")
          s=s.replace("<div class=\"mobile-order\"><button onclick=\"openOrder()\">🛒 Order from Biva's</button></div>", "")
          s=s.replace(".conclusion{padding-bottom:95px}", ".conclusion{padding-bottom:62px}")
          new_section='''<section class="conclusion" id="contact"><div class="container"><div class="conclusion-box"><div class="eyebrow">Come through</div><h2>Good food. Good people. Good reasons to come back.</h2><p>Find Biva's Grill & Cafe in Kagadi, Uganda. Browse the full menu, place your order on WhatsApp, or get in touch with us directly.</p><div class="contact-actions"><a class="contact-action primary" href="tel:+256785224952"><span>☎</span><b>Contact Us</b><small>+256 785 224 952</small></a><a class="contact-action dark" href="mailto:bivasgrillcafe@gmail.com"><span>✉</span><b>Email Us</b><small>bivasgrillcafe@gmail.com</small></a></div><div class="social-title">Follow Biva's</div><div class="social-actions"><a href="https://www.tiktok.com/@bivasgrillcafe" target="_blank" rel="noopener">TikTok</a><a href="https://www.instagram.com/bivasgrillcafe/" target="_blank" rel="noopener">Instagram</a><a href="https://www.facebook.com/bivasgrillcafe/" target="_blank" rel="noopener">Facebook</a></div><div class="contact-line"><a class="contact-pill" href="#menu">Explore Full Menu →</a><a class="contact-pill" href="https://wa.me/256785224952" target="_blank" rel="noopener">Order on WhatsApp</a></div></div></div></section>'''
          s=re.sub(r'<section class="conclusion" id="contact">.*?</section>', new_section, s, count=1, flags=re.S)
          marker='.conclusion-box{max-width:850px;margin:auto}'
          css='''.conclusion-box{max-width:900px;margin:auto}.contact-actions{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:30px auto 24px}.contact-action{min-width:245px;padding:17px 22px;border-radius:16px;display:grid;grid-template-columns:34px 1fr;text-align:left;align-items:center;border:1px solid var(--line);transition:.2s}.contact-action:hover{transform:translateY(-3px);box-shadow:0 12px 28px #4c250d16}.contact-action span{grid-row:span 2;font-size:22px}.contact-action b{font-size:16px}.contact-action small{font-size:11px;margin-top:3px}.contact-action.primary{background:var(--gold);color:var(--dark);border-color:var(--gold)}.contact-action.dark{background:var(--dark);color:#fff;border-color:var(--dark)}.contact-action.dark small{color:#d9c8ba}.social-title{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:2.2px;color:var(--orange);margin-top:26px}.social-actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:12px}.social-actions a{background:#fff;border:1px solid var(--line);border-radius:100px;padding:10px 16px;font-size:12px;font-weight:900}.social-actions a:hover{background:var(--dark);color:#fff;border-color:var(--dark)}'''
          if marker in s and 'contact-actions{' not in s:
              s=s.replace(marker,css)
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "chore: site layout cleanup"
          git push
