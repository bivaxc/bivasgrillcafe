name: Update social and contact section
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-social-contact.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update contact section only
        shell: python
        run: |
          from pathlib import Path
          p = Path('site.html')
          s = p.read_text()
          old = '''<div class="contact-grid"><div class="contact-card"><h3>Opening Hours</h3><p>Every day<br><strong>7:00 AM – 10:00 PM</strong></p><p>Free WiFi • DStv • Live Football • Fresh Drinks</p></div><div class="contact-card"><h3>WhatsApp Orders</h3><p>+256 785 224 952</p><a class="wa-link" href="https://wa.me/256785224952?text=Hello%20Biva's%20Grill%20%26%20Cafe%2C%20I%20would%20like%20to%20place%20an%20order." target="_blank">WhatsApp Us</a></div></div>'''
          new = '''<div class="contact-grid"><div class="contact-card"><h3>Opening Hours</h3><p>Every day<br><strong>7:00 AM – 10:00 PM</strong></p><p>Free WiFi • DStv • Live Football • Fresh Drinks</p></div><div class="contact-card"><h3>Contact Us</h3><p>WhatsApp: +256 785 224 952<br>Email: <a href="mailto:info@bivasgrillcafe.com" style="color:#f6c56b;font-weight:900">info@bivasgrillcafe.com</a></p><a class="wa-link" href="https://wa.me/256785224952?text=Hello%20Biva's%20Grill%20%26%20Cafe%2C%20I%20would%20like%20to%20place%20an%20order." target="_blank">WhatsApp Us</a></div><div class="contact-card"><h3>Follow Us</h3><p>Stay connected with Biva's Grill & Cafe.</p><p style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:0"><a href="https://www.instagram.com/bivasgrillcafe/" target="_blank" rel="noopener" style="color:#f6c56b;font-weight:900">Instagram</a><a href="https://www.facebook.com/bivasgrillcafe/" target="_blank" rel="noopener" style="color:#f6c56b;font-weight:900">Facebook</a><a href="https://www.tiktok.com/@bivasgrillcafe" target="_blank" rel="noopener" style="color:#f6c56b;font-weight:900">TikTok</a></p></div></div>'''
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one contact block, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
      - name: Commit site change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site.html
          git commit -m 'Add social media and business contact details'
          git push
