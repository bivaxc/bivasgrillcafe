name: Remove announcement bar
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  remove-bar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove announcement bar
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('.announcement{background:var(--gold);text-align:center;font-size:11px;font-weight:900;letter-spacing:1.3px;padding:8px}', '')
          s = s.replace('.announcement{font-size:9px}', '')
          s = s.replace('<div class="announcement">🔥 KAGADI\'S FOOD, FOOTBALL & GOOD TIMES</div>', '')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove top announcement bar"
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/remove-announcement.yml
          git commit -m "Remove temporary cleanup workflow"
          git push
