name: Apply website UI patch
on:
  push:
    branches: [main]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          python3 patch.py
          python3 remove_floating_whatsapp.py
      - name: Commit patched site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html shell.html site.html
          git diff --cached --quiet || git commit -m 'Remove floating WhatsApp action'
          git push
