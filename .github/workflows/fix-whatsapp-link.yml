name: Fix WhatsApp Contact Link

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-link:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix WhatsApp button
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('site.html')
          s = p.read_text(encoding='utf-8')
          old = '<a class="contact-btn wa-link" href="https://wa.me/256785224952">WhatsApp Us</a>'
          new = '<a class="contact-btn wa-link" href="https://api.whatsapp.com/send?phone=256785224952" target="_blank" rel="noopener noreferrer" onclick="window.location.href=\'https://api.whatsapp.com/send?phone=256785224952\';return false;">WhatsApp Us</a>'
          if old not in s:
              raise SystemExit('Expected WhatsApp button markup was not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site.html
          git rm .github/workflows/fix-whatsapp-link.yml
          git commit -m "Fix WhatsApp contact button [skip ci]"
          git push
