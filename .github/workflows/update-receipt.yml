name: Update receipt
on:
  push:
    paths:
      - '.github/workflows/update-receipt.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update receipt generator
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('site.html')
          s=p.read_text()
          new=r'''function receipt(d){if(!window.jspdf){alert('Receipt engine is still loading. Please tap again.');return false}const{jsPDF}=window.jspdf,doc=new jsPDF();const black=[0,0,0],white=[255,255,255];doc.setFillColor(...white);doc.rect(0,0,210,297,'F');doc.setTextColor(...black);doc.setFont('times','bold');doc.setFontSize(20);doc.text("BIVA'S GRILL & CAFE",15,18);doc.setFontSize(10);doc.setFont('times','normal');doc.text('Good Food. Good Times.',15,26);doc.setFont('times','bold');doc.setFontSize(16);doc.text('E-RECEIPT',15,42);doc.setFont('times','normal');doc.setFontSize(10);let y=52;[['Order number',d.no],['Date & time',d.date],['Customer',d.name],['Order type',d.type]].forEach(r=>{doc.text(`${r[0]}: ${r[1]}`,15,y);y+=7});y+=5;doc.setFont('times','bold');doc.text('ITEM',15,y);doc.text('QTY',125,y);doc.text('AMOUNT',155,y);doc.line(15,y+3,195,y+3);y+=11;doc.setFont('times','normal');const ensure=(n=10)=>{if(y+n>282){doc.addPage();doc.setFillColor(...white);doc.rect(0,0,210,297,'F');doc.setTextColor(...black);y=18;return true}return false};const addItem=(name,qty,amount)=>{ensure(9);doc.text(String(name),15,y,{maxWidth:105});doc.text(String(qty),125,y);doc.text(money(amount),155,y);y+=8};d.foods.forEach(i=>addItem(i.name,i.qty,i.price*i.qty));d.drinks.forEach(i=>{const free=Math.min(i.qty,d.included);addItem(i.name+(free?' (combo included)':''),i.qty,i.price*i.qty-free*3000)});ensure(24);y+=3;doc.line(15,y,195,y);y+=9;doc.setFont('times','normal');[['Food subtotal',d.foodTotal],['Drinks subtotal',d.drinkTotal],['Delivery',d.delivery?money(d.delivery):'To be confirmed']].forEach(r=>{doc.text(r[0],115,y);doc.text(typeof r[1]==='number'?money(r[1]):r[1],155,y);y+=8});doc.line(15,y,195,y);y+=10;doc.setFont('times','bold');doc.setFontSize(14);doc.text('GRAND TOTAL',115,y);doc.text(money(d.total),155,y);y+=13;doc.setFontSize(10);doc.setFont('times','bold');doc.text('Customer details',15,y);y+=8;doc.setFont('times','normal');doc.text(`Name: ${d.name||'None'}`,15,y);y+=7;doc.text(`Order type: ${d.type||'None'}`,15,y);y+=9;doc.setFont('times','bold');doc.text('Instructions',15,y);y+=7;doc.setFont('times','normal');const notes=doc.splitTextToSize(d.notes||'None',180);notes.forEach(t=>{ensure(6);doc.text(t,15,y);y+=6});y+=4;doc.setFont('times','bold');doc.text('Delivery note',15,y);y+=7;doc.setFont('times','normal');const note=doc.splitTextToSize('Customer care will call to confirm your order and discuss delivery charges.',180);note.forEach(t=>{ensure(6);doc.text(t,15,y);y+=6});y+=8;doc.setFont('times','normal');doc.text('Provisional receipt. Final availability is confirmed on WhatsApp.',15,y,{maxWidth:180});y+=8;doc.text('Hoima Road, Kagadi Town, opposite Pearl Bank Kagadi Branch',15,y,{maxWidth:180});const safeName=String(d.name||'Customer').trim().replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'Customer';doc.save(`${safeName}-${d.no}.pdf`);return true}'''
          pat=r'function receipt\(d\)\{.*?\}function submitOrder'
          s2,n=re.subn(pat,new+'function submitOrder',s,count=1)
          if n!=1: raise SystemExit('receipt function not found')
          p.write_text(s2)
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site.html
          git commit -m 'Update e-receipt format and filename' || exit 0
          git push
