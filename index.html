<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Biva's Grill & Cafe | Kagadi</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="app" src="shell.html" title="Biva's Grill & Cafe"></iframe><script>(function(){function patch(){try{var shell=document.getElementById('app');var sd=shell&&shell.contentDocument;if(!sd)return;var site=sd.getElementById('site');var td=site&&site.contentDocument;if(!td)return;var btn=td.querySelector('.submit');if(btn)btn.textContent='Complete Order';var cards=td.querySelectorAll('.popular-card');cards.forEach(function(card){var h=card.querySelector('h3');if(h&&h.textContent.trim()==='Rolex + Drink'){h.textContent='Rolex';var p=card.querySelector('.price');if(p)p.textContent='UGX 6,000';var desc=card.querySelector('p');if(desc)desc.textContent='Ugandan favourite street food with eggs and fresh veggies.';}});var removeNames={'Rolex + Drink Combo':true,'Chicken & Chips':true};td.querySelectorAll('.item').forEach(function(item){var name=item.querySelector('.item-name');if(name&&removeNames[name.textContent.trim()])item.remove();});}catch(e){console.error(e)}}var app=document.getElementById('app');app.addEventListener('load',function(){patch();setTimeout(patch,200);setTimeout(patch,800);setTimeout(patch,2000);});setInterval(patch,1500);})();</script></body></html>
