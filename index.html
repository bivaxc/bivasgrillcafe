A_rDzYftd4O-rf1V5LlMjedZRumrA7QU9P9R1Ks1R38PLcbjFb-aqsNHBOOQ%26usqp%3DCAY&w=640'};td.querySelectorAll('.item').forEach(function(item){var nameEl=item.querySelector('.item-name'),priceEl=item.querySelector('.item-price'),img=item.querySelector('.item-img'),q=item.querySelector('.qty');if(!nameEl)return;var n=nameEl.textContent.trim();if(n==='Rwenzori Water'){nameEl.textContent='Water';if(priceEl)priceEl.textContent='UGX 2,000';if(q){q.dataset.name='Water';q.dataset.price='2000';}n='Water';}if(n==='Water'&&img)img.src=drinkImages['Rwenzori Water'];if(drinkImages[n]&&img)img.src=drinkImages[n];});if(!td.querySelector('.item .item-name[data-coke]')){var drinkList=td.querySelector('#drinkList');if(drinkList&&!Array.from(drinkList.querySelectorAll('.item-name')).some(function(e){return e.textContent.trim()==='Coca-Cola';})){var item=td.createElement('div');item.className='item';item.innerHTML='<img class="item-img" src="'+drinkImages['Coca-Cola']+'" alt="Coca-Cola" loading="lazy"><div class="item-copy"><div class="item-name" data-coke="1">Coca-Cola</div><div class="item-price">UGX 3,000</div></div><div class="stepper"><button type="button" class="minus">−</button><input class="qty drink" data-name="Coca-Cola" data-price="3000" value="0" readonly><button type="button">+</button></div>';var q=item.querySelector('.qty');item.querySelector('.minus').onclick=function(){q.value=Math.max(0,+q.value-1);td.defaultView.updateTotals()};item.querySelector('.stepper button:last-child').onclick=function(){q.value=+q.value+1;td.defaultView.updateTotals()};drinkList.appendChild(item);}}if(!td.querySelector('[data-burger-section]')){var foodList=td.querySelector('#foodList');var menuSection=foodList&&foodList.parentElement;if(menuSection){var heading=td.createElement('h3');heading.textContent='🍔 Burgers';heading.setAttribute('data-burger-section','1');menuSection.appendChild(heading);[['Beef Burger',15000,'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=500&q=85'],['Chicken Burger',15000,'https://images.unsplash.com/photo-1606755962773-d324e0a13086?auto=format&fit=crop&w=500&q=85']].forEach(function(b){var item=td.createElement('div');item.className='item';item.innerHTML='<img class="item-img" src="'+b[2]+'" alt="'+b[0]+'" loading="lazy"><div class="item-copy"><div class="item-name">'+b[0]+'</div><div class="item-price">UGX '+b[1].toLocaleString()+'</div></div><div class="stepper"><button type="button" class="minus">−</button><input class="qty food burger-qty" data-name="'+b[0]+'" data-price="'+b[1]+'" value="0" readonly><button type="button">+</button></div>';var q=item.querySelector('.burger-qty');item.querySelector('.minus').onclick=function(){q.value=Math.max(0,+q.value-1);td.defaultView.updateTotals()};item.querySelector('.stepper button:last-child').onclick=function(){q.value=+q.value+1;td.defaultView.updateTotals()};menuSection.appendChild(item);});}}}catch(e){console.error(e)}}var app=document.getElementById('app');app.addEventListener('load',function(){patch();setTimeout(patch,200);setTimeout(patch,800);setTimeout(patch,2000);});setInterval(patch,1500);})();</script></body></html>
