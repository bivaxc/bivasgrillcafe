<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Biva's Grill & Cafe | Kagadi</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="app" src="shell.html" title="Biva's Grill & Cafe"></iframe><script>(function(){function patch(){try{var shell=document.getElementById('app');var sd=shell&&shell.contentDocument;if(!sd)return;var site=sd.getElementById('site');var td=site&&site.contentDocument;if(!td)return;var btn=td.querySelector('.submit');if(btn)btn.textContent='Complete Order';var cards=td.querySelectorAll('.popular-card');cards.forEach(function(card){var h=card.querySelector('h3');if(h&&h.textContent.trim()==='Rolex + Drink'){h.textContent='Rolex';var p=card.querySelector('.price');if(p)p.textContent='UGX 6,000';var desc=card.querySelector('p');if(desc)desc.textContent='Ugandan favourite street food with eggs and fresh veggies.';}});var removeNames={'Rolex + Drink Combo':true,'Chicken & Chips':true,'Chips & Sausages':true};td.querySelectorAll('.item').forEach(function(item){var name=item.querySelector('.item-name');if(name&&removeNames[name.textContent.trim()])item.remove();});var novida='https://isokko.com/m/media/upload/photos/2025/10/Screenshot_20251019-151344_68f6b5d663d65_compressed_370kb_10.png';td.querySelectorAll('.item').forEach(function(item){var name=item.querySelector('.item-name');if(name&&name.textContent.trim()==='Novida'){var im=item.querySelector('.item-img');if(im)im.src=novida;}});if(!td.querySelector('[data-burger-section]')){var menuSection=td.querySelector('#foodList')&&td.querySelector('#foodList').parentElement;if(menuSection){var heading=td.createElement('h3');heading.textContent='🍔 Burgers';heading.setAttribute('data-burger-section','1');menuSection.appendChild(heading);[['Beef Burger',15000,'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=500&q=85'],['Chicken Burger',15000,'https://images.unsplash.com/photo-1606755962773-d324e0a13086?auto=format&fit=crop&w=500&q=85']].forEach(function(b){var item=td.createElement('div');item.className='item';item.innerHTML='<img class="item-img" src="'+b[2]+'" alt="'+b[0]+'" loading="lazy"><div class="item-copy"><div class="item-name">'+b[0]+'</div><div class="item-price">UGX '+b[1].toLocaleString()+'</div></div><div class="stepper"><button type="button" class="minus">−</button><input class="qty food burger-qty" data-name="'+b[0]+'" data-price="'+b[1]+'" value="0" readonly><button type="button">+</button></div>';var q=item.querySelector('.burger-qty');item.querySelector('.minus').onclick=function(){q.value=Math.max(0,+q.value-1);td.defaultView.updateTotals()};item.querySelector('.stepper button:last-child').onclick=function(){q.value=+q.value+1;td.defaultView.updateTotals()};menuSection.appendChild(item);});}}}catch(e){console.error(e)}}var app=document.getElementById('app');app.addEventListener('load',function(){patch();setTimeout(patch,200);setTimeout(patch,800);setTimeout(patch,2000);});setInterval(patch,1500);})();</script></body></html>
