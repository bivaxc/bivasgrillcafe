-sub">Relax, watch, connect and enjoy the experience at Biva's.</p><div class="bg-experience-grid"><article class="bg-experience-card"><img src="https://images.unsplash.com/photo-1517466787929-bc90951d0974?auto=format&fit=crop&w=900&q=85"><div class="bg-experience-body"><h3>⚽ Live Football</h3><p>Catch the big matches with friends, food and drinks.</p></div></article><article class="bg-experience-card"><img src="https://images.unsplash.com/photo-1593784991095-a205069470b6?auto=format&fit=crop&w=900&q=85"><div class="bg-experience-body"><h3>📺 DStv</h3><p>Enjoy sports and your favourite programmes while you dine.</p></div></article><article class="bg-experience-card"><img src="https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=900&q=85"><div class="bg-experience-body"><h3>📶 Free WiFi</h3><p>Stay connected while you relax, work or meet.</p></div></article><article class="bg-experience-card"><img src="https://images.unsplash.com/photo-1511632765486-a01980e01a18?auto=format&fit=crop&w=900&q=85"><div class="bg-experience-body"><h3>🎉 Good Vibes</h3><p>A comfortable place to hang out and enjoy good company.</p></div></article></div></div></section>`;const contact=d.getElementById('contact');if(contact)contact.parentNode.insertBefore(x,contact)}if(!d.getElementById('bgNetwork')){const x=d.createElement('section');x.id='bgNetwork';x.className='bg-section bg-network';x.innerHTML=`<div class="bg-inner"><div class="bg-kicker">Connect at Biva's</div><h2 class="bg-title">Networking</h2><p class="bg-sub">A relaxed environment for conversations that matter.</p><div class="bg-network-box"><div class="bg-network-card"><h3>🤝 Meet & Connect</h3><p>Bring colleagues, friends, clients or business partners together over good food and coffee.</p></div><div class="bg-network-card"><h3>💻 Work & Talk</h3><p>With free WiFi and a comfortable atmosphere, Biva's can be a convenient spot for informal meetings, study sessions and networking.</p></div></div></div></sectio
