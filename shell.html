4a}.bg-review strong{font:900 14px Georgia,serif;color:#24160b}@media(max-width:800px){.bg-about-grid,.bg-network-box{grid-template-columns:1fr}.bg-experience-grid{grid-template-columns:repeat(2,1fr)}.bg-review-grid{grid-template-columns:1fr}.bg-section{padding:30px 12px!important}.bg-title{font-size:26px}.bg-experience-card{min-height:170px}}@media(min-width:801px){.bg-order-modal{align-items:center;justify-content:center;padding:20px}.bg-order-box{width:min(900px,96vw);max-height:92vh;border-radius:26px}.bg-order-close{position:absolute;top:8px;right:10px}.bg-order-title{position:absolute;top:0;border-radius:26px 26px 0 0}}`;d.head.appendChild(s);const hero=d.getElementById('home');if(hero){const btn=hero.querySelector('.hero-btn');if(btn){btn.textContent='Order';btn.href='#order'}}if(!d.getElementById('bgAbout')){const x=d.createElement('section');x.id='bgAbout';x.className='bg-section bg-about';x.innerHTML=`<div class="bg-inner"><div class="bg-about-grid"><div class="bg-about-copy"><div class="bg-kicker">About Biva's</div><h2 class="bg-title">A place for good food and good company.</h2><p>Biva's Grill & Cafe is a modern local grill and cafe in Kagadi, built around freshly prepared food, chilled drinks and a welcoming atmosphere.</p><p>Whether you are grabbing a quick Rolex, meeting friends for a meal, watching football or sitting down for a conversation, Biva's is designed to be more than just a place to eat.</p></div><div class="bg-about-card"><div class="bg-kicker">What we offer</div><h3 style="font:900 24px Georgia,serif;margin:0 0 12px">Food • Drinks • Football • Connection</h3><p>Enjoy grills, pizza, chicken, Rolex, soft drinks and more, with a comfortable space for relaxing, meeting and connecting.</p></div></div></div></section>`;if(hero)hero.parentNode.insertBefore(x,hero.nextSibling)}const popular=d.querySelector('.popular')?.closest('section');if(popular){popular.id='popularHome';const about=d.getElementById('bgAbout');if(about)about.parentNode.insertBefore(popular,about.nextSibling)}if(!d.getElementById('bgExperience')){const x=d.createElement('section');x.id='bgExperience';x.className='bg-section bg-experience';x.innerHTML=`<div class="bg-inner"><div class="bg-kicker">More than a meal</div><h2 class="bg-title">Entertainment & Atmosphere</h2><p class="bg-sub">Relax, watch, connect and enjoy the experience at Biva's.</p><div class="bg-experience-grid"><article class="bg-experience-card"><img src="https://images.unsplash.com/photo-1517466787929-bc90951d0974?auto=format&fit=crop&w=900&q=85"><div class="bg-experience-body"><h3>⚽ Live Football</h3><p>Catch the big matches with friends, food and drinks.</p></div></article><article class="bg-experience-card"><img src="https://images.unsplash.com/photo-1593784991095-a205069470b6?auto=format&fit=crop&w=900&q=85"><div class="bg-experience-body"><h3>📺 DStv</h3><p>Enjoy sports and your favourite programmes while you dine.</p></div></article><article class="bg-experience-card"><img src="https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=900&q=85"><div class="bg-experience-body"><h3>📶 Free WiFi</h3><p>Stay connected while you relax, work or meet.</p></div></article><article class="bg-experience-card"><img src="https://images.unsplash.com/photo-1511632765486-a01980e01a18?auto=format&fit=crop&w=900&q=85"><div class="bg-experience-body"><h3>🎉 Good Vibes</h3><p>A comfortable place to hang out and enjoy good company.</p></div></article></div></div></section>`;const contact=d.getElementById('contact');if(contact)contact.parentNode.insertBefore(x,contact)}if(!d.getElementById('bgNetwork')){const x=d.createElement('section');x.id='bgNetwork';x.className='bg-section bg-network';x.innerHTML=`<div class="bg-inner"><div class="bg-kicker">Connect at Biva's</div><h2 class="bg-title">Networking</h2><p class="bg-sub">A relaxed environment for conversations that matter.</p><div class="bg-network-box"><div class="bg-network-card"><h3>🤝 Meet & Connect</h3><p>Bring colleagues, friends, clients or business partners together over good food and coffee.</p></div><div class="bg-network-card"><h3>💻 Work & Talk</h3><p>With free WiFi and a comfortable atmosphere, Biva's can be a convenient spot for informal meetings, study sessions and networking.</p></div></div></div></section>`;const contact=d.getElementById('contact');if(contact)contact.parentNode.insertBefore(x,contact)}if(!d.getElementById('bgReviews')){const x=d.createElement('section');x.id='bgReviews';x.className='bg-section bg-reviews';x.innerHTML=`<div class="bg-inner"><div class="bg-kicker">Guest feedback</div><h2 class="bg-title">Reviews</h2><p class="bg-sub">We want every visit to be worth talking about.</p><article class="bg-review" style="max-width:760px;margin:0 auto"><div class="bg-stars">★★★★★</div><p>“Great place to grab food, watch football and relax with friends.”</p><strong>Guest review</strong></article><div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px"><button id="bgMoreReviewsBtn" type="button" style="border:0;border-radius:12px;background:#f5a623;color:#24160b;padding:12px 20px;font:900 15px Georgia,serif">More Reviews</button><button id="bgLeaveReviewBtn" type="button" style="border:0;border-radius:12px;background:#24160b;color:#fff;padding:12px 20px;font:900 15px Georgia,serif">Leave a Review</button></div><div id="bgMoreReviews" style="display:none;max-width:760px;margin:16px auto 0"><article class="bg-review" style="margin-bottom:12px"><div class="bg-stars">★★★★★</div><p>“The atmosphere is exactly what you want for a casual meal and conversation.”</p><strong>Guest review</strong></article><article class="bg-review"><div class="bg-stars">★★★★★</div><p>“Good food, chilled drinks and a convenient place to meet.”</p><strong>Guest review</strong></article></div></div>`;const contact=d.getElementById('contact');if(contact)contact.parentNode.appendChild(x);const moreBtn=x.querySelector('#bgMoreReviewsBtn'),more=x.querySelector('#bgMoreReviews');if(moreBtn&&more){moreBtn.onclick=()=>{const open=more.style.display!=='none';more.style.display=open?'none':'block';moreBtn.textContent=open?'More Reviews':'Hide Reviews'}}const leave=x.querySelector('#bgLeaveReviewBtn');if(leave){leave.onclick=()=>{const review=prompt('Write your review for Biva\'s Grill & Cafe:');if(review&&review.trim())alert('Thank you for your review! We appreciate your feedback.')}}}let modal=d.getElementById('bgOrderModal');if(!modal){modal=d.createElement('div');modal.id='bgOrderModal';modal.className='bg-order-modal';modal.innerHTML='<div class="bg-order-box"><div class="bg-order-title">🛒 Build Your Order</div><button class="bg-order-close" aria-label="Close order">×</button><div class="bg-order-content"></div></div>';d.body.appendChild(modal);const content=modal.querySelector('.bg-order-content'),menu=d.getElementById('menu'),order=d.getElementById('order');if(menu&&order){content.appendChild(menu);content.appendChild(order)}modal.querySelector('.bg-order-close').onclick=()=>modal.classList.remove('open');modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('open')})}const open=()=>{modal.classList.add('open');modal.querySelector('.bg-order-box').scrollTop=0};const b=d.querySelector('.cart-btn');if(b){b.removeAttribute('onclick');b.onclick=open;const label=b.querySelector('.label');if(label)label.textContent='Order';b.setAttribute('aria-label','Order')}d.querySelectorAll('a[href="#order"],a[href="#menu"]').forEach(a=>{a.onclick=e=>{e.preventDefault();open()}});const delivery=d.querySelector('.float-delivery');if(delivery){delivery.removeAttribute('href');delivery.onclick=e=>{e.preventDefault();open();if(typeof d.defaultView.setType==='function')d.defaultView.setType('Delivery')}}d.defaultView.submitOrder=function(){try{const x=d.defaultView.updateTotals();if(!x.foods.length){alert('Please select at least one food item.');return}const name=d.getElementById('name').value.trim(),location=d.getElementById('location').value.trim(),notes=d.getElementById('notes').value.trim();if(!name){alert('Please enter your name.');return}if(!location){alert('Please enter your location.');return}const no=d.defaultView.orderNo();const foodText=x.foods.map(i=>`• ${i.name} × ${i.qty} (UGX ${Number(i.price*i.qty).toLocaleString()})`).join('\n'),drinkText=x.drinks.map(i=>{const free=Math.min(i.qty,x.included);return`• ${i.name} × ${i.qty} (UGX ${Number(i.price*i.qty-free*3000).toLocaleString()}${free?' - 1 included in combo':''})`}).join('\n')||'• None';const msg=`🍽️ *BIVA'S GRILL & CAFE*\n*NEW ORDER #${no}*\n\nCustomer: ${name}\nOrder type: ${d.defaultView.orderType}\nLocation: ${location}\n\n*FOOD*\n${foodText}\n\n*DRINKS*\n${drinkText}\n\nFood subtotal: UGX ${Number(x.foodTotal).toLocaleString()}\nDrinks subtotal: UGX ${Number(x.drinkTotal).toLocaleString()}\nDelivery: ${x.delivery?'UGX '+Number(x.delivery).toLocaleString():'FREE'}\n*GRAND TOTAL: UGX ${Number(x.total).toLocaleString()}*\n\nInstructions: ${notes||'None'}\n\nPlease confirm availability and delivery details.`;window.open('https://wa.me/'+d.defaultView.WA+'?text='+encodeURIComponent(msg),'_blank')}catch(err){console.error(err);alert('Please try the order again.')}};const exp=d.getElementById('bgExperience'),net=d.getElementById('bgNetwork'),reviews=d.getElementById('bgReviews'),contact=d.getElementById('contact');if(contact){if(exp)contact.parentNode.insertBefore(exp,contact);if(net)contact.parentNode.insertBefore(net,contact);if(reviews)contact.parentNode.appendChild(reviews)}}catch(e){console.error(e)}}f.addEventListener('load',()=>{patch();setTimeout(patch,200);setTimeout(patch,1000);setTimeout(patch,2500)});</script></body></html>
