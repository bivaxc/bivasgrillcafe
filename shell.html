<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;overflow:hidden}</style></head><body><iframe id="site" src="site.html" title="Biva's Grill & Cafe"></iframe><script>const f=document.getElementById('site');function patch(){try{const d=f.contentDocument;if(!d)return;const s=d.createElement('style');s.textContent=`.appbar{position:static!important;top:auto!important;box-shadow:0 2px 8px rgba(0,0,0,.08)!important}.floating{display:none!important}.desktop-nav{display:none!important}.cart-btn{background:#f5a623!important;color:#24160b!important;border-radius:14px!important;font-size:0!important}.cart-btn .label{display:inline!important;font-size:15px!important}.cart-btn:before{content:'🛒 ';font-size:16px!important}.hero{padding-top:54px!important}`;d.head.appendChild(s);const b=d.querySelector('.cart-btn');if(b){const label=b.querySelector('.label');if(label)label.textContent='Order';b.setAttribute('aria-label','Order');b.title='Order'}}catch(e){}}f.addEventListener('load',()=>{patch();setTimeout(patch,200);setTimeout(patch,1000)})</script></body></html>
