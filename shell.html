<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;overflow:hidden}</style></head><body><iframe id="site" src="site.html" title="Biva's Grill & Cafe"></iframe><script>const f=document.getElementById('site');function patch(){try{const d=f.contentDocument;if(!d)return;const s=d.createElement('style');s.textContent=`.appbar{position:static!important;top:auto!important;box-shadow:0 2px 8px rgba(0,0,0,.08)!important}.floating{display:flex!important}.desktop-nav{display:none!important}.cart-btn{background:#f5a623!important;color:#24160b!important;border-radius:14px!important;font-size:0!important}.cart-btn .label{display:inline!important;font-size:15px!important}.cart-btn:before{content:'🛒 ';font-size:16px!important}.hero{padding-top:54px!important}#menu,#order{display:none!important}.bg-order-modal{position:fixed;inset:0;z-index:1000;background:rgba(18,11,6,.72);backdrop-filter:blur(8px);display:none;align-items:flex-end;padding:0}.bg-order-modal.open{display:flex}.bg-order-box{width:100%;max-height:96vh;overflow:auto;background:#f7efe3;border-radius:26px 26px 0 0;position:relative;padding-top:52px}.bg-order-close{position:fixed;right:14px;top:12px;z-index:1003;width:44px;height:44px;border:0;border-radius:50%;background:#24160b;color:#fff;font-size:25px;font-weight:900}.bg-order-title{position:fixed;left:0;right:0;top:0;z-index:1002;background:#24160b;color:#fff;padding:14px 58px 14px 18px;font:900 20px Georgia,serif}.bg-order-box #menu,.bg-order-box #order{display:block!important}.bg-order-box #menu{padding-top:12px}.bg-order-box #order{padding-top:8px}.bg-order-box #order .section-title{display:none}.bg-order-box #menu .section-title{display:none}.bg-offers{padding:28px 14px 18px!important;background:#fffaf2}.bg-offers-inner{max-width:1180px;margin:auto}.bg-offers-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.bg-offer-card{background:#fff;border:1px solid #eadfd1;border-radius:20px;padding:17px 14px;box-shadow:0 6px 18px rgba(65,39,17,.07)}.bg-offer-icon{font-size:30px;margin-bottom:8px}.bg-offer-card h3{margin:0 0 5px;font:900 18px Georgia,serif;color:#24160b}.bg-offer-card p{margin:0;color:#756a5e;font:14px/1.45 Georgia,serif}@media(max-width:800px){.bg-offers-grid{grid-template-columns:repeat(2,1fr)}.bg-offer-card{padding:14px 12px}}@media(min-width:801px){.bg-order-modal{align-items:center;justify-content:center;padding:20px}.bg-order-box{width:min(900px,96vw);max-height:92vh;border-radius:26px}.bg-order-close{position:absolute;top:8px;right:10px}.bg-order-title{position:absolute;top:0;border-radius:26px 26px 0 0}}`;d.head.appendChild(s);let modal=d.getElementById('bgOrderModal');if(!modal){modal=d.createElement('div');modal.id='bgOrderModal';modal.className='bg-order-modal';modal.innerHTML='<div class="bg-order-box"><div class="bg-order-title">🛒 Build Your Order</div><button class="bg-order-close" aria-label="Close order">×</button><div class="bg-order-content"></div></div>';d.body.appendChild(modal);const content=modal.querySelector('.bg-order-content');const menu=d.getElementById('menu');const order=d.getElementById('order');if(menu&&order){content.appendChild(menu);content.appendChild(order)}modal.querySelector('.bg-order-close').onclick=()=>modal.classList.remove('open');modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('open')})}const open=()=>{modal.classList.add('open');modal.querySelector('.bg-order-box').scrollTop=0};const b=d.querySelector('.cart-btn');if(b){b.removeAttribute('onclick');b.addEventListener('click',open);const label=b.querySelector('.label');if(label)label.textContent='Order';b.setAttribute('aria-label','Order');b.title='Order'}d.querySelectorAll('.desktop-nav a[href="#order"],a[href="#menu"]').forEach(a=>{if(a.getAttribute('href')==='#order'||a.textContent.trim().toLowerCase()==='order'){a.onclick=e=>{e.preventDefault();open()}}});const delivery=d.querySelector('.float-delivery');if(delivery){delivery.removeAttribute('href');delivery.onclick=e=>{e.preventDefault();open();if(typeof d.defaultView.setType==='function')d.defaultView.setType('Delivery')}}if(!d.getElementById('bgOffers')){const offers=d.createElement('section');offers.id='bgOffers';offers.className='bg-offers';offers.innerHTML='<div class="bg-offers-inner"><div class="section-title"><div><h2>🎉 Entertainment & More</h2><p>Relax, connect and enjoy more than great food.</p></div></div><div class="bg-offers-grid"><article class="bg-offer-card"><div class="bg-offer-icon">📺</div><h3>DStv</h3><p>Catch your favourite shows and sports while you eat.</p></article><article class="bg-offer-card"><div class="bg-offer-icon">📶</div><h3>Free WiFi</h3><p>Stay connected while you relax at Biva's.</p></article><article class="bg-offer-card"><div class="bg-offer-icon">⚽</div><h3>Live Football</h3><p>Enjoy the big matches with great food and drinks.</p></article><article class="bg-offer-card"><div class="bg-offer-icon">🎶</div><h3>Entertainment</h3><p>A relaxed place to meet, hang out and enjoy good vibes.</p></article></div></div>';const hero=d.getElementById('home');if(hero&&hero.nextSibling)hero.parentNode.insertBefore(offers,hero.nextSibling);else d.body.insertBefore(offers,d.body.firstChild)}}catch(e){console.error(e)}}f.addEventListener('load',()=>{patch();setTimeout(patch,200);setTimeout(patch,1000);setTimeout(patch,2500)});</script></body></html>
